# Memória e paralelismo do build.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true

kotlin.code.style=official

# O Filament no desktop é acessado por FFM (Project Panama) e o binding pede
# Java 22+; o projeto usa o toolchain 25 (veja `jvmToolchain` no build.gradle.kts)
# e o daemon pede a mesma versão em `gradle/gradle-daemon-jvm.properties`.
#
# Deixe o Gradle baixar sozinho o JDK do toolchain quando a máquina não tiver a
# versão exata (o `foojay-resolver-convention`, em settings.gradle.kts, é quem
# habilita essa busca).
org.gradle.java.installations.auto-download=true
