help_body=1. CHARGER LE MODÈLE\nTouchez le bouton en bas à droite (Charger un modèle 3D) et choisissez un fichier .glb, .gltf, .obj, .stl, .ply ou .3mf. Les formats .dae (COLLADA) et .fbx ne sont pas pris en charge — convertissez-les en .glb (Blender : Fichier ▸ Exporter ▸ glTF 2.0). Les modèles exportés depuis un logiciel de CAO/SketchUp sont souvent en millimètres et l'application ajuste l'échelle automatiquement ; les modèles de plusieurs milliers de pièces mettent des dizaines de secondes à s'ouvrir (la barre d'état le signale).\n\n2. CHOISIR OU CRÉER LE MARQUEUR\nDans la barre du bas, touchez l'icône QR code (Gérer le marqueur) puis Créer/Charger un marqueur :\n• Créer un marqueur : saisissez un nom, l'application dessine la figure, l'enregistre comme marqueur et exporte le PNG dans Pictures/ArkZ ARModelViewer/Marcadores — imprimez-le sur 15 cm de large.\n• Charger un marqueur : utilisez une image déjà présente sur l'appareil (photo, capture d'écran, code QR).\n\n3. POINTER LA CAMÉRA\nPointez vers la figure imprimée à 30–60 cm, avec un bon éclairage, en évitant les reflets, les plis et les angles trop rasants. La figure doit occuper une bonne partie du cadre. Sans modèle chargé, un cube cyan apparaît dessus : c'est l'indicateur que la détection fonctionne.\n\n4. AJUSTER LE MODÈLE\nDans le panneau Réglages du modèle (icône de réglages de la barre) : rotation X/Y/Z (0°, 0° et 0° au départ), taille (plus grande dimension, en mètres) et Élévation Z (éloigne ou rapproche le modèle du plan du marqueur). Les boutons − et + de la barre, la molette de la souris et, sur un pavé tactile, le pincement à deux doigts changent aussi la taille, et le bouton d'échelle automatique ajuste le modèle à la largeur du marqueur.\n\n5. CAPTURER L'ÉCRAN\nLe bouton appareil photo enregistre la vue actuelle (caméra + modèle, sans l'interface) dans Pictures/ArkZ ARModelViewer, avec le son de déclenchement.\n\nAUTRES CONSEILS\n• Réinitialiser (premier bouton de la barre) efface les détections et remet la rotation, la taille et l'élévation aux valeurs par défaut.\n• Si un modèle n'apparaît pas, le journal de l'application explique pourquoi : %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
about_description=Visionneuse de modèles 3D en réalité augmentée avec marqueurs d'image. Le moteur de rendu est Filament (celui de l'application Android) et la détection s'exécute sur cet ordinateur, avec OpenCV. Chargez un modèle, pointez la webcam vers une figure imprimée et voyez le modèle fixé dessus.
