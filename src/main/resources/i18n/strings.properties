help_body=1. CARREGAR O MODELO\nClique no botão do canto inferior direito (Carregar modelo 3D) e escolha um arquivo .glb, .gltf, .obj, .stl, .ply ou .3mf. Os formatos .dae (COLLADA) e .fbx não são suportados — converta para .glb (Blender: Arquivo ▸ Exportar ▸ glTF 2.0). Modelos exportados por CAD/SketchUp normalmente vêm em milímetros e o app ajusta a escala automaticamente; modelos com milhares de peças levam dezenas de segundos para abrir (a barra de status avisa).\n\n2. ESCOLHER OU CRIAR O MARCADOR\nNa barra inferior, clique no ícone de QR code (Gerenciar marcador) e depois em Criar/Carregar marcador:\n• Criar marcador: digite um nome e o app desenha a figura, salva como marcador e exporta o PNG em Pictures/ArkZ ARModelViewer/Marcadores — imprima em 15 cm de largura.\n• Carregar marcador: use uma imagem que já está neste computador (foto, print de tela, QR code).\n\n3. APONTAR A CÂMERA\nColoque a figura impressa a 30–60 cm da webcam, com boa iluminação, evitando reflexo, dobra e ângulo muito rasante. A figura deve ocupar boa parte do quadro. Sem modelo carregado, um cubo ciano aparece sobre ela — é o indicador de que a detecção está funcionando.\n\n4. AJUSTAR O MODELO\nNo painel Ajustes do modelo (ícone de controles da barra): rotação X/Y/Z (0°, 0° e 0° inicialmente), tamanho (maior dimensão, em metros) e Elevação Z (afasta ou aproxima o modelo do plano do marcador). Os botões − e + da barra, a roda do mouse e, no touchpad, a pinça de dois dedos também mudam o tamanho, e o botão de escala automática ajusta o modelo à largura do marcador.\n\n5. CAPTURAR A TELA\nO botão de câmera salva a vista atual (câmera + modelo, sem a interface) em Pictures/ArkZ ARModelViewer.\n\nOUTRAS DICAS\n• Reiniciar (primeiro botão da barra) descarta as detecções e volta rotação, tamanho e elevação ao padrão.\n• Se um modelo não aparecer, o log do aplicativo explica o motivo: %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
about_description=Visualizador de modelos 3D em Realidade Aumentada com marcadores de imagem. O renderizador é o Filament (o mesmo do app Android) e a detecção roda no próprio computador, com o OpenCV. Carregue um modelo, aponte a webcam para uma figura impressa e veja o modelo fixo sobre ela.
