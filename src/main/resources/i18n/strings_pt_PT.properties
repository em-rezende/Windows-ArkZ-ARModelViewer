help_body=1. CARREGAR O MODELO\nToque no botão do canto inferior direito (Carregar modelo 3D) e escolha um ficheiro .glb, .gltf, .obj, .stl, .ply ou .3mf. Os formatos .dae (COLLADA) e .fbx não são suportados — converta para .glb (Blender: Ficheiro ▸ Exportar ▸ glTF 2.0). Os modelos exportados de CAD/SketchUp costumam estar em milímetros e a aplicação ajusta a escala automaticamente; modelos com milhares de peças demoram dezenas de segundos a abrir (a barra de estado avisa).\n\n2. ESCOLHER OU CRIAR O MARCADOR\nNa barra inferior, toque no ícone do código QR (Gerir marcador) e depois em Criar/Carregar marcador:\n• Criar marcador: introduza um nome e a aplicação desenha a figura, guarda-a como marcador e exporta o PNG para Pictures/ArkZ ARModelViewer/Marcadores — imprima com 15 cm de largura.\n• Carregar marcador: use uma imagem que já está no dispositivo (fotografia, captura de ecrã, código QR).\n\n3. APONTAR A CÂMARA\nAponte para a figura impressa a 30–60 cm, com boa iluminação, evitando reflexos, dobras e ângulos muito rasantes. A figura deve ocupar boa parte do enquadramento. Sem modelo carregado aparece um cubo ciano sobre ela — é o indicador de que a deteção está a funcionar.\n\n4. AJUSTAR O MODELO\nNo painel Ajustes do modelo (ícone de controlos da barra): rotação X/Y/Z (0°, 0° e 0° inicialmente), tamanho (maior dimensão, em metros) e Elevação Z (afasta ou aproxima o modelo do plano do marcador). Os botões − e + da barra, a roda do rato e, no touchpad, a pinça de dois dedos também alteram o tamanho, e o botão de escala automática ajusta o modelo à largura do marcador.\n\n5. CAPTURAR O ECRÃ\nO botão de câmara guarda a vista atual (câmara + modelo, sem a interface) em Pictures/ArkZ ARModelViewer, com o som de disparo.\n\nOUTRAS DICAS\n• Reiniciar (primeiro botão da barra) descarta as deteções e repõe a rotação, o tamanho e a elevação nos valores padrão.\n• Se um modelo não aparecer, o registo da aplicação explica o motivo: %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
about_description=Visualizador de modelos 3D em realidade aumentada com marcadores de imagem. O renderizador é o Filament (o mesmo da aplicação Android) e a deteção é executada neste computador, com o OpenCV. Carregue um modelo, aponte a webcam para uma figura impressa e veja o modelo fixo sobre ela.
