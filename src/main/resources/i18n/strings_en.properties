help_body=1. LOAD THE MODEL\nClick the button in the bottom-right corner (Load 3D model) and pick a .glb, .gltf, .obj, .stl, .ply or .3mf file. The .dae (COLLADA) and .fbx formats are not supported — convert them to .glb (Blender: File ▸ Export ▸ glTF 2.0). Models exported from CAD/SketchUp usually come in millimetres and the app adjusts the scale automatically; models with thousands of parts take tens of seconds to open (the status bar warns you).\n\n2. CHOOSE OR CREATE THE MARKER\nIn the bottom bar, click the QR code icon (Manage marker) and then Create/Load marker:\n• Create marker: type a name and the app draws the pattern, saves it as a marker and exports the PNG to Pictures/ArkZ ARModelViewer/Marcadores — print it 15 cm wide.\n• Load marker: use an image already on this computer (photo, screenshot, QR code).\n\n3. POINT THE CAMERA\nHold the printed pattern 30–60 cm from the webcam, with good lighting, avoiding glare, creases and very shallow angles. The pattern should fill a good part of the frame. With no model loaded, a cyan cube appears over it — that is the sign that detection is working.\n\n4. ADJUST THE MODEL\nIn the Model adjustments panel (the bar's controls icon): X/Y/Z rotation (0°, 0° and 0° to start), size (largest dimension, in metres) and Z elevation (moves the model away from or into the marker plane). The − and + buttons in the bar, the mouse wheel and, on a touchpad, the two-finger pinch also change the size, and the auto-scale button fits the model to the marker width.\n\n5. CAPTURE THE SCREEN\nThe camera button saves the current view (camera + model, without the interface) to Pictures/ArkZ ARModelViewer.\n\nOTHER TIPS\n• Reset (first button in the bar) drops the detections and returns rotation, size and elevation to the defaults.\n• If a model does not appear, the application log explains why: %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
about_description=Augmented-reality 3D model viewer with image markers. The renderer is Filament (the same one used by the Android app) and detection runs on this computer, using OpenCV. Load a model, point the webcam at a printed pattern and see the model fixed over it.
