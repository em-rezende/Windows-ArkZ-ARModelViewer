help_body=1. CARGAR EL MODELO\nToca el botón de la esquina inferior derecha (Cargar modelo 3D) y elige un archivo .glb, .gltf, .obj, .stl, .ply o .3mf. Los formatos .dae (COLLADA) y .fbx no son compatibles: conviértelos a .glb (Blender: Archivo ▸ Exportar ▸ glTF 2.0). Los modelos exportados desde CAD/SketchUp suelen estar en milímetros y la app ajusta la escala automáticamente; los modelos con miles de piezas tardan decenas de segundos en abrirse (la barra de estado lo avisa).\n\n2. ELEGIR O CREAR EL MARCADOR\nEn la barra inferior, toca el icono del código QR (Gestionar marcador) y luego Crear/Cargar marcador:\n• Crear marcador: escribe un nombre y la app dibuja la figura, la guarda como marcador y exporta el PNG a Pictures/ArkZ ARModelViewer/Marcadores — imprímelo con 15 cm de ancho.\n• Cargar marcador: usa una imagen que ya está en el dispositivo (foto, captura de pantalla, código QR).\n\n3. APUNTAR LA CÁMARA\nApunta a la figura impresa a 30–60 cm, con buena luz, evitando reflejos, dobleces y ángulos muy rasantes. La figura debe ocupar buena parte del encuadre. Sin modelo cargado aparece un cubo cian sobre ella: es el indicador de que la detección funciona.\n\n4. AJUSTAR EL MODELO\nEn el panel Ajustes del modelo (icono de controles de la barra): rotación X/Y/Z (0°, 0° y 0° inicialmente), tamaño (dimensión mayor, en metros) y Elevación Z (aleja o acerca el modelo al plano del marcador). Los botones − y + de la barra, la rueda del ratón y, en el touchpad, la pinza de dos dedos también cambian el tamaño, y el botón de escala automática ajusta el modelo al ancho del marcador.\n\n5. CAPTURAR LA PANTALLA\nEl botón de cámara guarda la vista actual (cámara + modelo, sin la interfaz) en Pictures/ArkZ ARModelViewer, con el sonido de disparo.\n\nOTROS CONSEJOS\n• Reiniciar (primer botón de la barra) descarta las detecciones y devuelve la rotación, el tamaño y la elevación a los valores por defecto.\n• Si un modelo no aparece, el registro de la aplicación explica el motivo: %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
about_description=Visor de modelos 3D en realidad aumentada con marcadores de imagen. El renderizador es Filament (el mismo de la aplicación Android) y la detección se ejecuta en este equipo, con OpenCV. Cargue un modelo, apunte la webcam a una figura impresa y vea el modelo fijo sobre ella.
