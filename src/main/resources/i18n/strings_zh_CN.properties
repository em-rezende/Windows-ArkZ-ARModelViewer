help_body=1. 加载模型\n点击右下角的按钮（加载 3D 模型），选择 .glb、.gltf、.obj、.stl、.ply 或 .3mf 文件。不支持 .dae（COLLADA）和 .fbx 格式 — 请先转换为 .glb（Blender：文件 ▸ 导出 ▸ glTF 2.0）。由 CAD/SketchUp 导出的模型通常以毫米为单位，应用会自动调整比例；包含数千个部件的模型需要数十秒才能打开（状态栏会提示）。\n\n2. 选择或创建标记\n在底部工具栏点击二维码图标（管理标记），然后选择创建/加载标记：\n• 创建标记：输入名称，应用会绘制图案、保存为标记并导出 PNG 到 Pictures/ArkZ ARModelViewer/Marcadores — 请按 15 厘米宽度打印。\n• 加载标记：使用设备上已有的图片（照片、屏幕截图、二维码）。\n\n3. 对准相机\n在 30–60 厘米处对准打印的图案，光线充足，避免反光、折痕和过于倾斜的角度。图案应占据画面的较大比例。未加载模型时图案上会出现一个青色立方体 — 这表示识别正在工作。\n\n4. 调整模型\n在模型调整面板（工具栏中的调节图标）：旋转 X/Y/Z（初始为 0°、0°、0°）、大小（最大尺寸，单位米）和高度 Z（让模型远离或靠近标记平面）。工具栏中的 − 和 + 按钮、鼠标滚轮，以及触控板上的双指捏合也可以改变大小，自动缩放按钮会把模型调整到标记宽度。\n\n5. 截屏\n相机按钮会把当前画面（相机 + 模型，不含界面）保存到 Pictures/ArkZ ARModelViewer，并播放快门声。\n\n其他提示\n• 重新开始（工具栏第一个按钮）会清除识别结果，并把旋转、大小和高度恢复为默认值。\n• 如果模型没有显示，应用日志会说明原因：%LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
about_description=使用图像标记的增强现实 3D 模型查看器。渲染器为 Filament（与 Android 应用相同），识别在本机使用 OpenCV 运行。加载模型，将摄像头对准打印的图案，即可看到模型固定在图案上。
