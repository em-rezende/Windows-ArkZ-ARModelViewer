# Chaves que existem apenas no bundle pt-BR do app Android (values/ e
# values-pt-rBR/), aplicadas a TODOS os bundles por tools/apply-i18n-overrides.ps1.
#
# Sao nomes proprios, endonimos e dados de contato: o valor e o mesmo em qualquer
# idioma. No Android elas simplesmente caem no padrao (portugues) nos outros
# idiomas — aqui a paridade de chaves e completa, o que deixa a interface correta
# em qualquer idioma (e o teste I18nBundlesTest cobra essa paridade).
#
# Rodar o script e idempotente: o valor e substituido pelo mesmo texto.

app_name=ArkZ ARModelViewer
language_pt_br=Português (Brasil)
language_pt_pt=Português (Portugal)
language_en=English
language_es=Español
language_fr=Français
language_de=Deutsch
language_it=Italiano
language_zh=中文（简体）
about_developer_name=Ezequiel M. Rezende
about_developer=Copyright (C) 2026 Ark-Z Arquitetura Ltda
about_site=https://em-rezende.github.io/
about_email=emrezende@gmail.com

# `about_developer` mantem o NOME do Android (e o valor e o texto do Android no
# `strings.xml` do pt-BR), mas o valor passa a ser a linha de direito autoral com
# o ano: no Android o aviso de licenca vem da ficha da Play Store, e aqui ele
# precisa aparecer na propria interface (GPL-3.0, secao 5). O texto da licenca em
# si (`about_license`) muda de idioma, entao ele mora nos arquivos por idioma —
# nao aqui.

# Chaves NOVAS desta versão (não existem no app Android): o Android não tinha uma
# tela de câmera própria para escolher dispositivo. O valor aqui é o pt-BR e os
# outros idiomas trazem a sua tradução em `strings_<locale>.properties`.
camera_title=Câmera
camera_status_running=Câmera %1$d · %2$d×%3$d
