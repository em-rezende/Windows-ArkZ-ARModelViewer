# Ajuda: substitui a do Android (mencionava o Logcat) e troca a pinca de tela pelo caminho real
# de zoom desta plataforma. Mantida aqui para o pipeline continuar idempotente.
help_body=1. MODELL LADEN\nTippen Sie unten rechts auf die Schaltfläche (3D-Modell laden) und wählen Sie eine Datei .glb, .gltf, .obj, .stl, .ply oder .3mf. Die Formate .dae (COLLADA) und .fbx werden nicht unterstützt — konvertieren Sie sie in .glb (Blender: Datei ▸ Exportieren ▸ glTF 2.0). Aus CAD/SketchUp exportierte Modelle sind meist in Millimetern; die App skaliert sie automatisch. Modelle mit Tausenden von Teilen brauchen Dutzende Sekunden (die Statusleiste informiert).\n\n2. MARKER WÄHLEN ODER ERSTELLEN\nTippen Sie unten auf das QR-Code-Symbol (Marker verwalten) und dann auf Marker erstellen/laden:\n• Marker erstellen: Namen eingeben — die App zeichnet das Muster, speichert es als Marker und exportiert das PNG nach Pictures/ArkZ ARModelViewer/Marcadores; drucken Sie es 15 cm breit.\n• Marker laden: verwenden Sie ein Bild, das bereits auf dem Gerät ist (Foto, Screenshot, QR-Code).\n\n3. KAMERA AUSRICHTEN\nRichten Sie die Kamera aus 30–60 cm auf das gedruckte Bild, bei gutem Licht und ohne Reflexionen, Falten oder sehr flache Winkel. Das Bild sollte einen guten Teil des Rahmens füllen. Ohne geladenes Modell erscheint ein cyanfarbener Würfel darauf — das zeigt, dass die Erkennung funktioniert.\n\n4. MODELL ANPASSEN\nIm Panel Modellanpassungen (Regler-Symbol in der Leiste): Drehung X/Y/Z (anfangs 0°, 0° und 0°), Größe (größte Abmessung in Metern) und Höhe Z (bewegt das Modell von der Markerebene weg oder zu ihr hin). Die Schaltflächen − und + in der Leiste, das Mausrad und auf einem Touchpad die Zwei-Finger-Pinch-Geste ändern ebenfalls die Größe, und die automatische Skalierung passt das Modell an die Markerbreite an.\n\n5. BILDSCHIRM AUFNEHMEN\nDie Kamera-Schaltfläche speichert die aktuelle Ansicht (Kamera + Modell, ohne Oberfläche) in Pictures/ArkZ ARModelViewer — mit Auslösegeräusch.\n\nWEITERE TIPPS\n• Neu starten (erste Schaltfläche der Leiste) verwirft die Erkennungen und setzt Drehung, Größe und Höhe auf die Standardwerte zurück.\n• Wenn ein Modell nicht erscheint, erklärt das Anwendungsprotokoll den Grund: %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
