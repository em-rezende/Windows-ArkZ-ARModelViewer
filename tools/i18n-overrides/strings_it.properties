# Ajuda: substitui a do Android (mencionava o Logcat) e troca a pinca de tela pelo caminho real
# de zoom desta plataforma. Mantida aqui para o pipeline continuar idempotente.
help_body=1. CARICARE IL MODELLO\nTocca il pulsante in basso a destra (Carica modello 3D) e scegli un file .glb, .gltf, .obj, .stl, .ply o .3mf. I formati .dae (COLLADA) e .fbx non sono supportati: convertili in .glb (Blender: File ▸ Esporta ▸ glTF 2.0). I modelli esportati da CAD/SketchUp di solito sono in millimetri e l'app adatta la scala automaticamente; i modelli con migliaia di parti richiedono decine di secondi (la barra di stato lo segnala).\n\n2. SCEGLIERE O CREARE IL MARCATORE\nNella barra in basso tocca l'icona del codice QR (Gestisci marcatore) e poi Crea/Carica marcatore:\n• Crea marcatore: digita un nome e l'app disegna la figura, la salva come marcatore ed esporta il PNG in Pictures/ArkZ ARModelViewer/Marcadores — stampalo largo 15 cm.\n• Carica marcatore: usa un'immagine già presente sul dispositivo (foto, screenshot, codice QR).\n\n3. INQUADRARE LA FOTOCAMERA\nInquadra la figura stampata a 30–60 cm, con buona luce, evitando riflessi, pieghe e angoli troppo radenti. La figura deve occupare buona parte dell'inquadratura. Senza modello caricato compare un cubo ciano sopra di essa: è l'indicatore che il rilevamento funziona.\n\n4. REGOLARE IL MODELLO\nNel pannello Regolazioni del modello (icona dei controlli nella barra): rotazione X/Y/Z (all'inizio 0°, 0° e 0°), dimensione (dimensione maggiore, in metri) ed Elevazione Z (allontana o avvicina il modello al piano del marcatore). I pulsanti − e + della barra, la rotellina del mouse e, sul touchpad, il pinch a due dita cambiano anche la dimensione, e il pulsante di scala automatica adatta il modello alla larghezza del marcatore.\n\n5. CATTURARE LA SCHERMATA\nIl pulsante fotocamera salva la vista attuale (fotocamera + modello, senza l'interfaccia) in Pictures/ArkZ ARModelViewer, con il suono di scatto.\n\nALTRI CONSIGLI\n• Riavvia (primo pulsante della barra) elimina i rilevamenti e riporta rotazione, dimensione ed elevazione ai valori predefiniti.\n• Se un modello non compare, il registro dell'app spiega il motivo: %LOCALAPPDATA%\\ArkZ ARModelViewer\\logs\\app.log
